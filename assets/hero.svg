<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
      .display { font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes pulseRing { 0% { r: 4; opacity: 0.7; } 100% { r: 14; opacity: 0; } }
      @keyframes drift1 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(18px,-12px); } }
      @keyframes drift2 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(-14px,10px); } }
      @keyframes scanlineMove { 0% { transform: translateY(-100%); } 100% { transform: translateY(500%); } }
      @keyframes glowPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes shimmer { 0% { x1: -100%; x2: 0%; } 100% { x1: 100%; x2: 200%; } }
      .cursor { animation: blink 1.1s step-end infinite; }
      .pulse-dot { animation: pulse 2s ease-in-out infinite; }
      .pulse-ring { animation: pulseRing 2s ease-out infinite; }
      .drift-1 { animation: drift1 8s ease-in-out infinite; }
      .drift-2 { animation: drift2 10s ease-in-out infinite; }
      .scanline { animation: scanlineMove 8s linear infinite; }
      .glow-pulse { animation: glowPulse 3s ease-in-out infinite; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" stroke="#00D4FF" stroke-opacity="0.035" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="ambient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#00D4FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient2" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="-100%" y1="0%" x2="0%" y2="0%">
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="45%" stop-color="#00D4FF"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#e6edf3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="#06080c"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  <rect width="1200" height="480" fill="url(#ambient)"/>
  <rect width="1200" height="480" fill="url(#ambient2)"/>
  <rect x="0" y="0" width="1200" height="1" fill="url(#topLine)" class="glow-pulse"/>
  <g class="drift-1"><circle cx="120" cy="100" r="1.5" fill="#00D4FF" opacity="0.6"/></g>
  <g class="drift-2"><circle cx="1080" cy="140" r="1.5" fill="#A855F7" opacity="0.5"/></g>
  <g class="drift-1"><circle cx="200" cy="380" r="1.5" fill="#00D4FF" opacity="0.4"/></g>
  <g class="drift-2"><circle cx="1000" cy="360" r="1.5" fill="#00D4FF" opacity="0.5"/></g>
  <g class="drift-1"><circle cx="80" cy="240" r="1" fill="#00D4FF" opacity="0.3"/></g>
  <g class="drift-2"><circle cx="1120" cy="280" r="1" fill="#A855F7" opacity="0.3"/></g>
  <path d="M50 50 L50 90 M50 50 L90 50" stroke="#00D4FF" stroke-width="1.5" opacity="0.55"/>
  <path d="M1150 50 L1150 90 M1150 50 L1110 50" stroke="#00D4FF" stroke-width="1.5" opacity="0.55"/>
  <path d="M50 430 L50 390 M50 430 L90 430" stroke="#00D4FF" stroke-width="1.5" opacity="0.55"/>
  <path d="M1150 430 L1150 390 M1150 430 L1110 430" stroke="#00D4FF" stroke-width="1.5" opacity="0.55"/>
  <ellipse cx="600" cy="240" rx="520" ry="220" fill="url(#ambient)" opacity="0.6"/>
  <rect x="180" y="90" width="840" height="300" rx="14" fill="#0a0d14"/>
  <rect x="180" y="90" width="840" height="300" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <path d="M180 104 Q180 90 194 90 L1006 90 Q1020 90 1020 104 L1020 142 L180 142 Z" fill="#10141c"/>
  <line x1="180" y1="142" x2="1020" y2="142" stroke="#1e2430" stroke-width="1"/>
  <circle cx="208" cy="116" r="6.5" fill="#ff5f56"/>
  <circle cx="228" cy="116" r="6.5" fill="#ffbd2e"/>
  <circle cx="248" cy="116" r="6.5" fill="#27c93f"/>
  <rect x="278" y="100" width="160" height="42" rx="6" fill="#0a0d14"/>
  <rect x="278" y="100" width="160" height="2" fill="#00D4FF"/>
  <text x="358" y="126" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">~/kaif</text>
  <text x="504" y="126" text-anchor="middle" class="mono" font-size="10" fill="#6e7681">jarvis</text>
  <text x="630" y="126" text-anchor="middle" class="mono" font-size="10" fill="#6e7681">kairos.ai</text>
  <circle cx="940" cy="116" r="4" fill="#27c93f" class="pulse-ring"/>
  <circle cx="940" cy="116" r="4" fill="#27c93f" class="pulse-dot"/>
  <text x="952" y="120" class="mono" font-size="10" fill="#7d8590" letter-spacing="1.5">ONLINE</text>
  <g class="mono" font-size="12" fill="#3d4451" text-anchor="end">
    <text x="232" y="180">01</text>
    <text x="232" y="216">02</text>
    <text x="232" y="248">03</text>
    <text x="232" y="270">04</text>
    <text x="232" y="296">05</text>
    <text x="232" y="320">06</text>
    <text x="232" y="352">07</text>
  </g>
  <line x1="250" y1="160" x2="250" y2="368" stroke="#1e2430" stroke-width="1"/>
  <text x="270" y="180" class="mono" font-size="12" fill="#7d8590"><tspan fill="#00D4FF">$</tspan> whoami</text>
  <text x="270" y="216" class="display" font-size="28" font-weight="700" fill="url(#nameGrad)" letter-spacing="4">KAIF ANSARI</text>
  <text x="270" y="248" class="mono" font-size="12" fill="#7d8590"><tspan fill="#00D4FF">$</tspan> cat role.txt</text>
  <text x="270" y="270" class="mono" font-size="12" fill="#c9d1d9" letter-spacing="1.2">AI ENGINEER  ·  BUILDER  ·  18</text>
  <text x="270" y="296" class="mono" font-size="12" fill="#7d8590"><tspan fill="#00D4FF">$</tspan> echo $MISSION</text>
  <text x="270" y="320" class="mono" font-size="12" fill="#8b949e" font-style="italic">"not demos. not wrappers. real products."</text>
  <text x="270" y="352" class="mono" font-size="12" fill="#7d8590"><tspan fill="#00D4FF">$</tspan></text>
  <rect x="290" y="342" width="8" height="14" fill="#00D4FF" class="cursor"/>
  <line x1="180" y1="360" x2="1020" y2="360" stroke="#1e2430" stroke-width="1"/>
  <path d="M180 360 L180 376 Q180 390 194 390 L1006 390 Q1020 390 1020 376 L1020 360 Z" fill="#10141c"/>
  <text x="208" y="380" class="mono" font-size="10" fill="#7d8590">main</text>
  <text x="252" y="380" class="mono" font-size="10" fill="#6e7681">·</text>
  <text x="270" y="380" class="mono" font-size="10" fill="#7d8590">utf-8</text>
  <text x="320" y="380" class="mono" font-size="10" fill="#6e7681">·</text>
  <text x="338" y="380" class="mono" font-size="10" fill="#7d8590">zsh</text>
  <text x="992" y="380" text-anchor="end" class="mono" font-size="10" fill="#7d8590">v2026.1</text>
  <rect x="180" y="142" width="840" height="60" fill="#00D4FF" opacity="0.025" class="scanline"/>
  <text x="62" y="240" transform="rotate(-90 62 240)" text-anchor="middle" class="mono" font-size="10" fill="#3d4451" letter-spacing="3">// KAIF_ANSARI</text>
  <text x="1138" y="240" transform="rotate(90 1138 240)" text-anchor="middle" class="mono" font-size="10" fill="#3d4451" letter-spacing="3">// v2026</text>
</svg>

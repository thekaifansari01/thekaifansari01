<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" fill="none">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" stroke="#00D4FF" stroke-opacity="0.05" stroke-width="0.5" fill="none"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="320" fill="#0d1117"/>
  <rect width="1000" height="320" fill="url(#grid)"/>
  <ellipse cx="500" cy="160" rx="450" ry="200" fill="url(#glow)"/>
  <rect x="200" y="50" width="600" height="220" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="225" cy="75" r="6" fill="#ff5f56"/>
  <circle cx="245" cy="75" r="6" fill="#ffbd2e"/>
  <circle cx="265" cy="75" r="6" fill="#27c93f"/>
  <text x="500" y="80" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#7d8590" letter-spacing="2">~/kaif — zsh</text>
  <text x="220" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#7d8590"><tspan fill="#00D4FF">$</tspan> whoami</text>
  <text x="220" y="148" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="url(#nameGrad)" letter-spacing="3">KAIF ANSARI</text>
  <text x="220" y="175" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#7d8590"><tspan fill="#00D4FF">$</tspan> cat role.txt</text>
  <text x="220" y="200" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#c9d1d9" letter-spacing="1">AI ENGINEER · BUILDER · 18</text>
  <text x="220" y="227" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8590"><tspan fill="#00D4FF">$</tspan> echo "not demos. not wrappers. real products."</text>
  <text x="220" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8b949e" font-style="italic">not demos. not wrappers. real products.</text>
  <rect x="220" y="265" width="8" height="14" fill="#00D4FF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>

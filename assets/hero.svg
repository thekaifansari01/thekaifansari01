  <text x="220" y="215" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8590"><tspan fill="#00D4FF">$</tspan> cat role.txt</text>
  <text x="220" y="240" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9" letter-spacing="1.5">AI ENGINEER · BUILDER · 18</text>
